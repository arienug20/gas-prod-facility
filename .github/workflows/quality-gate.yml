name: Quality Gate

# Gate mutu deterministik: 16 drawing wajib lulus validate_cad_rules.py.
# Sengaja TIDAK memasang cadgen: backend ezdxf (cadshim) sudah terbukti
# menghasilkan keluaran identik, sedangkan cadgen menarik kernel OCC +
# playwright (ratusan MB) yang membuat CI lambat dan rapuh.
#
# Untuk memasang cadgen di CI (opsional), jalankan workflow dengan
# input install_cadgen = true, atau set variable repo CADGEN_IN_CI=1.

on:
  push:
    branches: [main, master]
    paths:
      - "cad/**"
      - "skills/company-cad-standard/**"
      - "tools/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      install_cadgen:
        description: "Pasang backend cadgen (lambat: OCC + playwright)"
        type: boolean
        default: false
      strict_warnings:
        description: "Anggap warning linter sebagai error"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Lint 16 drawings (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 belum didukung: dependency OCC/cadgen belum ada wheel-nya.
        python: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cadgen.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Install cadgen (opsional)
        if: ${{ inputs.install_cadgen == true || vars.CADGEN_IN_CI == '1' }}
        timeout-minutes: 25
        continue-on-error: true
        run: pip install -r requirements-cadgen.txt

      - name: Ruff (lint kode)
        run: ruff check . --output-format=concise
        continue-on-error: true

      - name: Quality gate (sweep 16 DXF + tests)
        env:
          GPF_CAD_ALLOW_INSTALL: "0"
        run: |
          python tools/quality_gate.py ${{ inputs.strict_warnings && '--strict-warnings' || '' }} --json > gate.json || true
          python tools/quality_gate.py ${{ inputs.strict_warnings && '--strict-warnings' || '' }}

      - name: Upload hasil gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report-py${{ matrix.python }}
          path: gate.json
          if-no-files-found: ignore
          retention-days: 30

  regression:
    name: Rebuild & lint (backend ezdxf)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild semua drawing lalu lint ulang
        run: python tools/quality_gate.py --build --json > rebuild.json

      - name: Pastikan DXF hasil rebuild tidak berubah drastis
        run: |
          echo "Ringkasan rebuild:"
          python - <<'PY'
          import json
          d = json.load(open("rebuild.json"))
          for r in d["results"]:
              if not r["ok"]:
                  print("GAGAL:", r["name"], r["detail"])
          print("OK" if d["ok"] else "ADA YANG GAGAL")
          raise SystemExit(0 if d["ok"] else 1)
          PY

      - name: Upload artefak rebuild
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-report
          path: rebuild.json
          if-no-files-found: ignore
