[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpf-cad-suite"
version = "1.0.0"
description = "Gas Production Facility (GPF) CAD Suite — P&ID, piping plan, isometric generator + company QA linter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "PT Reka Elang Inovasi" }]
keywords = ["cad", "dxf", "pid", "piping", "isometric", "oil-and-gas"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

# Inti yang WAJIB untuk lint & render. `ezdxf` adalah satu-satunya dependency
# pihak ketiga nyata pada kode pustaka perusahaan (lihat cad/validate_cad_rules.py).
dependencies = ["ezdxf>=1.1,<2"]

[project.optional-dependencies]
# Backend "cadgen" resmi. CATATAN PENTING: sejak 0.7.22 cadgen menarik
# cadquery-ocp-novtk (kernel OCC, ratusan MB) + playwright. Instalasi bisa
# sangat lama - itulah sebabnya resolver (cadbackend.py) menempatkan backend
# ini opsional dan menyediakan fallback ezdxf.
cadgen = ["cadgen>=0.7.21,<0.8"]

# Backend verifikasi visual alternatif (DXF -> PNG headless).
cadcraft = [
  "matplotlib>=3.7,<4",
  "pillow>=10",
]

# Perkakas pengembangan & quality gate.
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "numpy>=1.26",           # hanya untuk analisis citra QA (test)
]

# Semua yang dibutuhkan quality gate CI (lint + render + test).
ci = [
  "gpf-cad-suite[dev,cadcraft]",
]

[project.urls]
Homepage = "https://github.com/arienug20/gas-prod-facility"

# ---------------------------------------------------------------------------
# Repo ini BUKAN paket yang di-distribusikan: pustaka perusahaan berada di
# `cad/` dan dijalankan langsung dari repo. Paket minimal ini hanya untuk
# menyediakan metadata dependency yang bisa dibaca `pip install .[ci]`.
# ---------------------------------------------------------------------------
[tool.setuptools]
py-modules = ["gpf_cad_suite"]

[tool.setuptools.package-data]
"*" = ["*.md"]

# ---------------------------------------------------------------------------
# Quality gate
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["cad", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
  "slow: test yang merender PNG / menjalankan subprocess",
  "needs_cadgen: butuh backend cadgen terpasang",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".git", "__pycache__", "skills/skills-patches"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Skrip generator menulis entity CAD; nama variabel pendek wajar.
"cad/*_common.py" = ["N802", "N803", "N806"]
"cad/*_demo.py" = ["E402"]
"cad/test_*.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = false
files = ["cadbackend.py"]

[tool.mypy-cad]
ignore_errors = true
